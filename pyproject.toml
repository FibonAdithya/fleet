[project]
name = "fleet"
version = "0.1.0"
description = "Parallel coding agents with explicit handoffs"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "jsonschema>=4.20", "PyYAML>=6.0", "tomli>=2.0"]

[project.scripts]
fleet = "fleet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
