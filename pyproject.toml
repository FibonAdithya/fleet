[project]
name = "fleet"
version = "0.1.0"
description = "Parallel coding agents with explicit handoffs"
requires-python = ">=3.10"
# rfc3339-validator is not optional decoration: jsonschema's FormatChecker
# silently skips "date-time" unless it is installed, which would leave
# handoff.schema.json's `from.run` format unenforced. See fleet.schemas.
dependencies = [
    "click>=8.1",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
    "rfc3339-validator>=0.1.4",
    "tomli>=2.0",
]

[project.scripts]
fleet = "fleet.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
